<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Impressum des Qubitring.com Engineering Office von Dipl. Ing. Martin Kunze (FH).">
  <title>Impressum – Qubitring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --wine: #5e1a1a;
      --wine-dark: #431111;
      --paper: #f5efe7;
      --ink: #171513;
      --muted: #655d55;
      --line: #d7cec3;
      --serif: "Merriweather", Georgia, serif;
      --sans: "Source Sans 3", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: var(--sans); }
    a { color: inherit; }
    .wrap { width: min(1120px, calc(100% - 48px)); margin-inline: auto; }
    .site-header { background: var(--wine); color: white; }
    .nav { min-height: 82px; display: flex; align-items: center; justify-content: space-between; gap: 30px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: white; text-decoration: none; }
    .brand-mark { display: grid; place-items: center; flex: 0 0 43px; width: 43px; height: 43px; border: 1px solid #c9aaa1; border-radius: 9px; font: 900 25px var(--serif); }
    .brand-name { font-size: 13px; letter-spacing: .12em; font-weight: 700; text-transform: uppercase; }
    .nav-links { display: flex; align-items: center; gap: clamp(20px, 3vw, 42px); }
    .nav-links a { color: #f2e9e5; font-size: 14px; text-decoration: none; }
    .nav-links a:hover { color: white; text-decoration: underline; text-underline-offset: 5px; }
    .menu-toggle { display: none; padding: 8px 11px; border: 1px solid #ffffff70; border-radius: 4px; background: transparent; color: white; font: inherit; }
    main { min-height: 62vh; padding-block: clamp(64px, 10vw, 112px); }
    .eyebrow { margin: 0 0 16px; color: var(--wine); font-size: 14px; font-weight: 700; }
    h1, h2 { font-family: var(--serif); }
    h1 { margin: 0 0 42px; font-size: clamp(38px, 5vw, 58px); line-height: 1.15; letter-spacing: -.04em; }
    .details { max-width: 720px; padding: 32px; border: 1px solid var(--line); border-radius: 8px; background: #eee7de; }
    .details h2 { margin: 0 0 20px; font-size: 22px; }
    address { color: var(--muted); font-size: 18px; font-style: normal; line-height: 1.8; }
    .site-footer { padding-block: 34px 24px; background: #211b19; color: #f3eee8; }
    .footer-bottom { display: flex; justify-content: space-between; gap: 20px; border-top: 1px solid #ffffff2a; padding-top: 20px; color: #c9beb7; font-size: 13px; }
    .legal-links { display: flex; gap: 20px; }
    .legal-links a { color: inherit; text-decoration: none; }
    .legal-links a:hover { color: white; text-decoration: underline; }
    :focus-visible { outline: 3px solid #d19b77; outline-offset: 4px; }
    @media (max-width: 760px) {
      .wrap { width: min(100% - 36px, 1120px); }
      .nav { min-height: 70px; }
      .brand-name { display: none; }
      .menu-toggle { display: block; }
      .nav-links { display: none; position: absolute; z-index: 2; top: 70px; left: 0; right: 0; padding: 18px; background: var(--wine-dark); flex-direction: column; align-items: stretch; gap: 0; }
      .nav-links.open { display: flex; }
      .nav-links a { padding: 12px 8px; }
      .details { padding: 24px; }
      .footer-bottom { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav wrap" aria-label="Hauptnavigation">
      <a class="brand" href="/" aria-label="Qubitring – Startseite"><span class="brand-mark" aria-hidden="true">Q</span><span class="brand-name">Qubitring · Engineering Office</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav-links">Menü</button>
      <div class="nav-links" id="nav-links">
        <a href="/#leistungen">Leistungen</a><a href="/#referenzen">Über uns</a><a href="/#kontakt">Kontakt</a><a href="/#kontakt">Beratung anfragen</a>
      </div>
    </nav>
  </header>
  <main class="wrap">
    <p class="eyebrow">Rechtliche Informationen</p>
    <h1>Impressum</h1>
    <section class="details" aria-labelledby="provider">
      <h2 id="provider">Angaben gemäß § 5 DDG</h2>
      <address>
        Dipl. Ing. Martin Kunze (FH)<br>
        Qubitring.com Engineering Office<br>
        Stresemannstrasse 5<br>
        08523 Plauen
      </address>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-bottom">
        <a href="/">Zurück zur Startseite</a>
        <div class="legal-links"><a href="/impressum.html" aria-current="page">Impressum</a><a href="/datenschutz">Datenschutz</a></div>
      </div>
    </div>
  </footer>
  <script>
    const menuButton = document.querySelector('.menu-toggle');
    const navLinks = document.querySelector('.nav-links');
    menuButton.addEventListener('click', () => {
      const isOpen = menuButton.getAttribute('aria-expanded') === 'true';
      menuButton.setAttribute('aria-expanded', String(!isOpen));
      navLinks.classList.toggle('open', !isOpen);
    });
    navLinks.addEventListener('click', event => {
      if (event.target.closest('a')) {
        menuButton.setAttribute('aria-expanded', 'false');
        navLinks.classList.remove('open');
      }
    });
  </script>
</body>
</html>
